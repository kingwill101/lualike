# Validate packages on pull requests and publish tagged packages to pub.dev.

name: Publish

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    tags:
      - '[0-9A-z]+-v[0-9]+.[0-9]+.[0-9]+'

jobs:
  validate:
    if: ${{ github.event_name == 'pull_request' }}
    uses: dart-lang/ecosystem/.github/workflows/publish.yaml@1bdafd85bb97b331ddd683577f48a5dfa7f4cb49
    with:
      use-flutter: true
      # Same-repository PRs can receive the result directly. Fork PRs use
      # post_summaries.yml, which republishes the result with a trusted token.
      write-comments: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      pull-requests: write

  publish:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # setup-dart provisions the GitHub OIDC credentials used by pub.dev.
      # Install it before Flutter because flutter-actions/setup-flutter
      # replaces the dart executable on PATH.
      - name: Set up Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d

      - name: Set up Flutter
        uses: flutter-actions/setup-flutter@6e2468fd827c4a7337cd4b835a6049b78bc0bd1f

      - name: Install Firehose
        run: >
          dart pub global activate --source git
          https://github.com/dart-lang/ecosystem
          --git-path pkgs/firehose/
          --git-ref 1bdafd85bb97b331ddd683577f48a5dfa7f4cb49

      - name: Publish packages
        env:
          INPUTS_TAG_PREFIX: v
        run: |
          dart pub global run firehose \
            --publish \
            --use-flutter \
            --tag-prefix "$INPUTS_TAG_PREFIX"
