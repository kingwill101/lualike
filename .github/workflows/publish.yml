# Validate packages on pull requests and publish tagged packages to pub.dev.

name: Publish

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    tags:
      - '[0-9A-z]+-v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    uses: dart-lang/ecosystem/.github/workflows/publish.yaml@main
    with:
      use-flutter: true
      # Fork pull requests cannot write comments with the pull_request token.
      # post_summaries.yml republishes this result with a trusted token.
      write-comments: false
    permissions:
      id-token: write
      pull-requests: write
